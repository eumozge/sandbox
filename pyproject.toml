[project]
name = "sandbox"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.0",
    "alembic>=1.18.4",
    "click>=8.3.2",
    "pydantic-settings>=2.14.2",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.43.0",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
]
lint = [
    "mypy",
    "ruff",
]

[tool.uv.workspace]
members = []

[tool.pyright]
useLibraryCodeForTypes = true
