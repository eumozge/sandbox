[project]
name = "sandbox"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.139.0",
    "fastapi-cache>=0.1.0",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
]
lint = [
    "mypy",
    "ruff",
]

[tool.uv.workspace]
members = []

[tool.pyright]
useLibraryCodeForTypes = true
